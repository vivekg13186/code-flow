services:
  codeflow:
    build: .
    container_name: codeflow
    ports:
      - "8000:8000"
    volumes:
      # your flows live OUTSIDE the container — edit them on the host and
      # the UI picks up changes live (the folder is re-scanned per request)
      - ./workflows:/data/workflows
      - ./environments:/data/environments
      # history persists across container rebuilds/restarts
      - ./history:/data/history
    # secrets: env JSON files can reference OS env vars as "${VAR}".
    # Put real values in a .env file next to this compose file (git-ignored):
    #   CODEFLOW_PROD_TOKEN=xyz...
    # and docker compose passes them through automatically via:
    # environment:
    #   - CODEFLOW_PROD_TOKEN=${CODEFLOW_PROD_TOKEN}
    restart: unless-stopped
